name: Publish

# Tag main with the version to publish: git tag v1.0.1 && git push origin v1.0.1
# (GitHub ne filtre pas les tags par branche : le job vérifie que le tag est bien sur main.)
# Trusted Publishing policy to declare on nuget.org (no API key needed):
#   Repository Owner: FrApp42 | Repository: WPF.Pwsh | Workflow File: publish.yml

on:
  push:
    tags: ['v*', '*.*.*']

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        shell: bash
        run: git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main$'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        shell: bash
        run: dotnet pack WPF.Pwsh.slnx --configuration Release -o artifacts -p:Version="${GITHUB_REF_NAME#v}"

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        shell: bash
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
